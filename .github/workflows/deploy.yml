name: deploy

on:
  push:
    branches: [main, cursor/**]
  workflow_dispatch:

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Deploy API and web to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured on this repository."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "Add repository secret VERCEL_TOKEN, then re-run this workflow."
              exit 1
            fi
            echo "Skipping production promote on push."
            exit 0
          fi
          bash scripts/deploy-vercel.sh
