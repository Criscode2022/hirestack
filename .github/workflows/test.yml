name: test

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hirestack/shared build
      - run: pnpm prisma generate
      - run: pnpm test
      - run: pnpm --filter @hirestack/api typecheck
      - run: pnpm --filter @hirestack/api lint
      - run: pnpm --filter @hirestack/web typecheck

  e2e-preview:
    name: Playwright against Git preview
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      PLAYWRIGHT_BASE_URL: https://hirestack-angular-web-git-cursor-81b4d2-criscode2022s-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Git preview then run e2e
        run: |
          API_HEALTH="https://hirestack-nestjs-api-git-cursor-s-0812e1-criscode2022s-projects.vercel.app/api/health"
          for i in $(seq 1 36); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$PLAYWRIGHT_BASE_URL" || true)
            health=$(curl -sS -m 20 "$API_HEALTH" || true)
            sha=$(printf '%s' "$health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('gitSha',''))" 2>/dev/null || true)
            ok=$(printf '%s' "$health" | python3 -c "import sys,json; print(bool(json.load(sys.stdin).get('ok')))" 2>/dev/null || true)
            echo "preview=${code} apiSha=${sha:-none} want=${GITHUB_SHA} ok=${ok:-false}"
            if [ "$code" = "200" ] && [ "$ok" = "True" ]; then
              if [ -n "$sha" ] && [[ "$sha" == "$GITHUB_SHA"* ]]; then
                break
              fi
              if [ "$i" -ge 8 ]; then
                echo "Web is ready and Nest is healthy. Nest gitSha ${sha:-none} is from the last API commit; continuing."
                break
              fi
            fi
            sleep 10
          done
          PLAYWRIGHT_SNAP_DIR=/tmp/hirestack-e2e-ci pnpm exec playwright test apps/web/e2e/happy-path.spec.ts
